[package]
name = "watchgha"
version = "3.0.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Watch the status of GitHub Action runs"
repository = "https://github.com/nedbat/watchgha"
readme = "README.md"
keywords = ["github", "actions", "cli", "ci"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "watchgha"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
futures = "0.3"
netrc = "0.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
url = "2"

[profile.release]
lto = "thin"
strip = "symbols"
